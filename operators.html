<html>
  <body>
    <h1>BitWise operator</h1>
    <p id="bit"></p>
    <script>
      var a= 12;
      var b=20;
      var c="";
      
      c += "a & b:" + (a&b) + "<br>";
      c += "a | b:" + (a|b) + "<br>";
      c += "a ^ b:" + (a^b) + "<br>";
      document.getElementById("bit").innerHTML="output:<br>" +c;
    </script>
  </body>
</html>
