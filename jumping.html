<html>
    <body>
        <h1 id="demo">break</h1>
        <script>
            let res="";
            for(let i=0;i<=20;i++){
                if(i==7){
                    break;
                }
                res += "output : " + i + "<br>";
            }
            document.getElementById("demo").innerHTML=res;
        </script>
    </body>
</html> 

<html>
    <body>
        <h1 id="demo">continue</h1>
        <script>
            let res ="";
            for(let i=0;i<=20;i++){
                if(i==8){
                    continue;
                }
                res += "output : " +i + "<br>";
            }
            document.getElementById("demo").innerHTML=res;
        </script>
    </body>
</html>


<html>
    <body>
        <h1 id="demo">return</h1>
        <script>
            function asreturn(){
                let res="";
                for(let i=0;i<=10;i++){
                    if(i>=7){
                        return res;
                    }
                    res += "output : " + i + "<br>";
                }
               return res;
            }
             document.getElementById("demo").innerHTML=asreturn();
        </script>
    </body>
</html>
