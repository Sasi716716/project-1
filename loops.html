<html>
  <body>
    <h1 id="demo">do while</h1>
    <script>
      let text="";
      let i=0;
      do{
        text += "<br> count numbers : " + i;
        i++;
      }
      while(i<10);
      document.getElementById("demo").innerHTML=text;
    </script>
  </body>
</html>
