<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My Protfolio</h1>
    <form style="text-align: center;">
        <h3>Use your fingerprint or password</h3>
        <input type="|" style="text-align: center;">
        <pre 1 style="text-align:center;"></pre>
    </form>
 <div class="keypad" role="group" aria-label="Keypad" style="text-align: center;">
      <!-- Number keys 1..9 -->
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <br>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <br>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <br>
      <!-- Bottom row: Clear, 0, Backspace -->
      <button class="key alt" data-action="clear" aria-label="Clear">Clear</button>
      <button class="key" data-key="0">0</button>
      <button class="key alt" data-action="back" aria-label="Backspace">⌫</button>
    </div>

    <div class="actions">
      <button id="btnReset" type="button">Reset</button>
      <button id="btnSubmit" type="button">Unlock</button>
    </div>
</body>
</html>
