<html>
    <body>
        <h1 id="demo">java</h1>
        <button onclick="myfunction()">Click Me</button>
        <script>
            let names=["Bheemisetty"];
            document.getElementById("demo").innerHTML=names;
            function myfunction(){
                names.push("Sasi Kumar");
                document.getElementById("demo").innerHTML=names;
            }
        </script>
    </body>
</html>
