<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Save Energy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #e9f7ef;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #28a745;
    }
    .account-info {
      background: white;
      padding: 20px;
      margin: 20px auto;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
      max-width: 400px;
    }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #28a745;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <h1>Welcome to Your Account</h1>
  <div class="account-info">
    <p><b>Username:</b> Guest</p>
    <p><b>Email:</b> guest@example.com</p>
    <p><b>Plan:</b> Free User</p>
    <button onclick="window.location.href='index.html'">Logout</button>
  </div>
</body>
</html>
