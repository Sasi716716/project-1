<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teams-Lite</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #fff;
  }

  h1, h2 {
    text-align: center;
  }

  .btn-container {
    text-align: center; /* Center buttons */
    margin-top: 20px;
  }

  .btn {
    display: inline-block;
    font-weight: bold;
    font-size: 16px;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px 0;
    text-align: center;
    text-decoration: none;
    width: 220px;   /* Same width */
    height: 50px;   /* Same height */
    line-height: 26px; /* Align text vertically */
  }

  .btn-get-started {
    background-color: #28a745; /* green */
  }

  .btn-signin {
    background-color: #4A63F6; /* blue */
  }

  .btn-join {
    background-color: #7941F7; /* purple */
  }

  #signinJoinContainer {
    display: none; /* Hidden by default */
  }
</style>
</head>
<body>

<h1>Welcome to Teams-Lite</h1>
<h2>Teams-Lite</h2>

<div class="btn-container">
  <button class="btn btn-get-started" id="getStartedBtn">Get Started</button>
</div>

<div class="btn-container" id="signinJoinContainer">
  <button class="btn btn-signin">Sign in with Google</button>
  <br>
  <button class="btn btn-join">Join MS Teams Meeting</button>
</div>

<script>
  const getStartedBtn = document.getElementById("getStartedBtn");
  const signinJoinContainer = document.getElementById("signinJoinContainer");

  getStartedBtn.addEventListener("click", () => {
    // Show the Sign-In and Join Meeting buttons
    signinJoinContainer.style.display = "block";
    // Optionally, hide the Get Started button
    getStartedBtn.style.display = "none";
  });
</script>

</body>
</html>
